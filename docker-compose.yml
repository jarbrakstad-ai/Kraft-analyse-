services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: kraft_analyse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kraft
      POSTGRES_PASSWORD: kraft
      POSTGRES_DB: kraft_analyse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kraft -d kraft_analyse"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: kraft_analyse_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kraft:kraft@db:5432/kraft_analyse
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: kraft_analyse_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
